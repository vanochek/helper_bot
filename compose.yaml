name: helper-bot
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: helper
      POSTGRES_DB: helper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Выполните bootstrap}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helper -d helper"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
