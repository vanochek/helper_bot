events { worker_connections 128; }
http {
    access_log off;
    error_log /dev/stderr crit;
    limit_req_zone $server_name zone=global:1m rate=10r/s;
    limit_req_zone $server_name zone=ai:1m rate=40r/m;
    limit_conn_zone $server_name zone=connections:1m;
    server {
        listen 8080;
        client_max_body_size 10m;
        client_body_timeout 15s;
        client_header_timeout 15s;
        send_timeout 30s;
        limit_conn connections 32;
        limit_req_status 429;
        limit_conn_status 503;
        location ~ ^/api/v1/(chat/messages|speech/transcriptions)$ {
            limit_req zone=ai burst=10 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_read_timeout 40s;
        }
        location / {
            limit_req zone=global burst=30 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_read_timeout 40s;
        }
    }
}
