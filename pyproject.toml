[project]
name = "helper-bot"
version = "0.1.0"
description = "Голосовой помощник для задач и встреч"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic-settings", "sqlalchemy", "psycopg[binary]", "alembic", "openai", "python-multipart", "tzdata"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helper_bot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
